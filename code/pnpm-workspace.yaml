packages:
  - 'backend/*'
  - 'frontends/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  msgpackr-extract: true

# Force a patched esbuild everywhere — the only remaining advisory is a dev-server
# SSRF in esbuild <0.25 pulled transitively by drizzle-kit's legacy loader.
overrides:
  esbuild: '>=0.25.0'
